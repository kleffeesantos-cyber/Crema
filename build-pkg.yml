# Compila o Crema (com o patch do Portal of Power) no GitHub e gera o .pkg para o PS4.
#
# Como usar (pelo celular, no seu fork):
#   1. Aba "Actions" -> "I understand my workflows, go ahead and enable them" (so na primeira vez).
#   2. "Build Crema PKG" (lista da esquerda) -> "Run workflow" -> "Run workflow".
#   3. Espere (a primeira vez leva 2 a 4 horas; as seguintes, bem menos, por causa do cache).
#   4. Quando ficar verde, o .pkg esta em "Releases" do fork (pre-release "portal-test-N").
#
# O arquivo vai em .github/workflows/build-pkg.yml (na raiz do repositorio).
name: Build Crema PKG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do pacote, no formato XX.YY (ex.: 03.31)"
        required: true
        default: "03.31"
      lab:
        description: "Instalar como app separado (Crema Lab), ao lado do Crema oficial"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-pkg
  cancel-in-progress: true

env:
  PSB: /home/runner/cemups4-build
  PS4_BUILD_ROOT: /home/runner/cemups4-build
  OPENORBIS: /opt/pacbrew/ps4/openorbis
  CEMU_SRC: /home/runner/cemups4-build/src/Cemu
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  DOTNET_ROLL_FORWARD: Major
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Compilar e empacotar
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: "0. Conferir a versao"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::A versao precisa ter o formato XX.YY (ex.: 03.31). Recebi: $VERSION"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: "1. Preparar a maquina (espaco em disco e pastas)"
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          df -h /
          nproc
          free -g
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
          mkdir -p "$PSB"/src "$PSB"/build "$PSB"/out "$PSB"/logs
          # os scripts e o CMake do Crema esperam o repositorio em ~/cemups4
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/cemups4"

      - name: "2. Instalar clang 21 e ferramentas"
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv bison flex perl xz-utils \
            libxml2 git curl wget gnupg lsb-release software-properties-common
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y lld-21 llvm-21
          clang-21 --version | head -1
          ld.lld-21 --version | head -1
          llvm-ar-21 --version | head -1
          cmake --version | head -1

      - name: "3. Baixar o toolchain do PS4 (OpenOrbis/PacBrew)"
        run: |
          docker pull xfangfang/pacbrew:latest
          cid=$(docker create xfangfang/pacbrew:latest)
          mkdir -p /tmp/pacbrew-extract
          if ! docker cp "$cid:/opt/pacbrew/." /tmp/pacbrew-extract; then
            echo "::error::Nao achei /opt/pacbrew na imagem. Onde esta o ps4vars.sh:"
            docker export "$cid" | tar -t | grep -E 'ps4vars\.sh' | head || true
            exit 1
          fi
          docker rm "$cid" > /dev/null
          sudo mkdir -p /opt/pacbrew
          sudo cp -a /tmp/pacbrew-extract/. /opt/pacbrew/
          rm -rf /tmp/pacbrew-extract
          ls "$OPENORBIS" | head -50

      - name: "4. Conferir o toolchain (falha cedo se faltar algo)"
        run: |
          missing=0
          need_file() { [ -e "$OPENORBIS/$1" ] || { echo "FALTA: $OPENORBIS/$1"; missing=1; }; }
          need_glob() { compgen -G "$OPENORBIS/$1" > /dev/null || { echo "FALTA: $OPENORBIS/$1"; missing=1; }; }
          for f in ps4vars.sh cmake/ps4.cmake link.x lib/crt1.o lib/crti.o lib/crtn.o \
                   lib/libclang_rt.builtins-x86_64.a lib/libunwind.a include \
                   bin/create-fself bin/ld.lld bin/linux/create-gp4 bin/linux/PkgTool.Core \
                   usr/lib/libturbojpeg.a; do
            need_file "$f"
          done
          need_glob "lib/libkernel*"
          need_glob "lib/libSceLibcInternal*"
          echo "--- bibliotecas de GPU (Gnm) no toolchain:"
          compgen -G "$OPENORBIS/lib/libSceGnm*" || echo "(nenhuma libSceGnm* encontrada: o link final pode falhar)"
          echo "--- samples/piglet:"
          ls "$OPENORBIS/samples/piglet" 2>/dev/null || echo "(sem samples/piglet: ok, o empacotamento pula esses modulos)"
          echo "--- bibliotecas que os programas do toolchain nao acham:"
          for b in bin/ld.lld bin/create-fself bin/linux/create-gp4 bin/linux/PkgTool.Core; do
            echo "# $b"
            ldd "$OPENORBIS/$b" 2>&1 | grep -E "not found" || echo "ok"
          done
          if [ "$missing" = 1 ]; then
            echo "::error::O toolchain da imagem esta incompleto (veja os FALTA acima)."
            exit 1
          fi

      # ---------- libc++ 21, runtime e bibliotecas (cache) ----------
      - name: "5. Cache do sysroot"
        id: sysroot-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PSB }}/sysroot
          key: sysroot-v1-${{ hashFiles('toolchain/**', 'scripts/build-deps.sh') }}

      - name: "6. Compilar libc++, runtime e bibliotecas (so na primeira vez)"
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/cemups4"
          bash toolchain/build-libcxx.sh > "$PSB/logs/libcxx.log" 2>&1 \
            || { echo "::error::libc++ falhou"; tail -n 150 "$PSB/logs/libcxx.log"; exit 1; }
          bash toolchain/build-runtime.sh > "$PSB/logs/runtime.log" 2>&1 \
            || { echo "::error::runtime falhou"; tail -n 100 "$PSB/logs/runtime.log"; exit 1; }
          # build-deps.sh mostra sozinho o fim do log da biblioteca que falhar
          bash scripts/build-deps.sh
          mkdir -p "$PSB/logs/deps"
          cp "$PSB"/build/deps/*.log "$PSB/logs/deps/" || true
          touch "$PSB/sysroot/.crema-ci-complete"
          rm -rf "$PSB"/src/llvm-project-* "$PSB/build/libcxx" "$PSB/src/deps" "$PSB/build/deps"
          du -sh "$PSB/sysroot"

      - name: "7. Guardar o sysroot no cache"
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PSB }}/sysroot
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

      # ---------- Mesa / RADV (cache) ----------
      - name: "8. Cache do Mesa"
        id: mesa-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PSB }}/build/mesa
          key: mesa-v1-${{ hashFiles('patches/mesa-ps4.patch', 'patches/mesa-ps4-aligned-vertex-fetch.patch', 'port/mesa/**', 'scripts/build-mesa.sh', 'toolchain/**', 'scripts/build-deps.sh') }}

      - name: "9. Preparar o Mesa 26.0.8 e as ferramentas dele"
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          cd "$PSB/src"
          curl -fsSL --retry 5 -o mesa.tar.xz https://archive.mesa3d.org/mesa-26.0.8.tar.xz
          mkdir -p mesa
          tar -xJf mesa.tar.xz -C mesa --strip-components=1
          rm mesa.tar.xz
          # o build-mesa.sh usa o commit do Mesa como identificador do cache de pipelines
          git -C mesa init -q
          git -C mesa add -A > /dev/null
          git -C mesa -c user.name=ci -c user.email=ci@example.invalid commit -qm "mesa 26.0.8"
          # o patch do Crema ja inclui o do DolphinPS4 (parte do Mesa original)
          git -C mesa apply --whitespace=nowarn "$HOME/cemups4/patches/mesa-ps4.patch"
          git -C mesa apply --whitespace=nowarn "$HOME/cemups4/patches/mesa-ps4-aligned-vertex-fetch.patch"
          # cabecalhos do libdrm (o PS4 nao tem DRM; so os .h entram)
          curl -fsSL --retry 5 -o libdrm.tar.xz https://dri.freedesktop.org/libdrm/libdrm-2.4.125.tar.xz
          mkdir -p libdrm
          tar -xJf libdrm.tar.xz -C libdrm --strip-components=1
          rm libdrm.tar.xz
          ls libdrm/include/drm | head -3
          ls libdrm/amdgpu | head -3
          # meson, mako, pyyaml
          python3 -m venv "$PSB/mesa-venv"
          "$PSB/mesa-venv/bin/pip" install --quiet meson mako pyyaml packaging
          # glslangValidator para o computador (mesma versao 15.1.0 usada nas bibliotecas)
          curl -fsSL --retry 5 -o glslang.tar.gz https://github.com/KhronosGroup/glslang/archive/refs/tags/15.1.0.tar.gz
          mkdir -p glslang-host
          tar -xzf glslang.tar.gz -C glslang-host --strip-components=1
          rm glslang.tar.gz
          cmake -G Ninja -S glslang-host -B glslang-host/build -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPT=OFF -DENABLE_HLSL=OFF -DGLSLANG_TESTS=OFF -DBUILD_EXTERNAL=OFF \
            -DCMAKE_INSTALL_PREFIX="$PSB/host-tools" > "$PSB/logs/glslang-host.log" 2>&1 \
            || { tail -n 60 "$PSB/logs/glslang-host.log"; exit 1; }
          ninja -C glslang-host/build install >> "$PSB/logs/glslang-host.log" 2>&1 \
            || { tail -n 60 "$PSB/logs/glslang-host.log"; exit 1; }
          "$PSB/host-tools/bin/glslangValidator" --version | head -2

      - name: "10. Compilar o Mesa (RADV)"
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/cemups4"
          bash scripts/build-mesa.sh setup > "$PSB/logs/mesa.log" 2>&1 \
            || { echo "::error::Mesa falhou"; grep -n -E "error:|ERROR|FAILED" "$PSB/logs/mesa.log" | head -40; tail -n 80 "$PSB/logs/mesa.log"; exit 1; }
          # o Cemu so usa as bibliotecas .a: tira o resto antes de guardar no cache
          find "$PSB/build/mesa" -type f ! -name '*.a' -delete
          find "$PSB/build/mesa" -type d -empty -delete
          du -sh "$PSB/build/mesa"

      - name: "11. Guardar o Mesa no cache"
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PSB }}/build/mesa
          key: ${{ steps.mesa-cache.outputs.cache-primary-key }}

      # ---------- Cemu + patches do Crema + Portal of Power ----------
      - name: "12. Baixar o Cemu e aplicar os patches"
        run: |
          base=$(awk '/^base:/{print $2}' "$HOME/cemups4/patches/BASE.txt")
          echo "base do Cemu: $base"
          mkdir -p "$CEMU_SRC"
          cd "$CEMU_SRC"
          git init -q
          git remote add origin https://github.com/cemu-project/Cemu.git
          git fetch -q --depth 1 origin "$base"
          git checkout -q FETCH_HEAD
          subs=$(git submodule status | awk '{print $2}' | grep -v -E 'vcpkg|metal-cpp' || true)
          # shellcheck disable=SC2086
          git submodule update --init --recursive --depth 1 -- $subs \
            || git submodule update --init --recursive -- $subs
          git apply --whitespace=nowarn "$HOME/cemups4/patches/cemu-ps4.patch"
          if [ -f "$HOME/cemups4/patches/crema-skylanders-portal.patch" ]; then
            git apply --whitespace=nowarn "$HOME/cemups4/patches/crema-skylanders-portal.patch"
            echo "patch do Portal of Power aplicado"
          else
            echo "::warning::patches/crema-skylanders-portal.patch nao existe: compilando o Crema sem o portal"
          fi
          git status --short | head -20

      - name: "13. Configurar o Cemu"
        run: |
          cd "$HOME/cemups4"
          bash scripts/logrun.sh configure bash scripts/configure-cemu.sh \
            || { echo "::error::configure falhou"; tail -n 120 "$PSB/logs/configure.log"; exit 1; }
          tail -n 5 "$PSB/logs/configure.log"

      - name: "14. Compilar o Cemu (leva 1 hora ou mais)"
        run: |
          cd "$HOME/cemups4"
          log="$PSB/logs/build.log"
          # mostra um sinal de vida a cada 5 minutos
          ( while sleep 300; do echo "$(date +%H:%M) $(tail -n 1 "$log" 2>/dev/null | cut -c1-150)"; done ) &
          hb=$!
          rc=0
          # -k 0: nao para no primeiro erro, assim um unico run mostra todos os erros
          bash scripts/logrun.sh build bash scripts/build-cemu.sh -k 0 || rc=$?
          kill "$hb" 2>/dev/null || true
          if [ "$rc" != 0 ] || grep -q -E "error:|^FAILED|Failed to build FSELF" "$log"; then
            echo "::error::A compilacao do Cemu falhou"
            echo "Quantidade de erros: $(grep -c 'error:' "$log" || true)"
            grep -n -E "error:|^FAILED|Failed to build FSELF|check-oelf" "$log" | sed 's|.*/src/Cemu/||' | head -80
            tail -n 40 "$log"
            exit 1
          fi
          tail -n 3 "$log"

      - name: "15. Empacotar o .pkg"
        env:
          VERSION: ${{ inputs.version }}
          LAB: ${{ inputs.lab }}
        run: |
          cd "$HOME/cemups4"
          # sem os modulos da Sony (nao ficam no GitHub): o empacotador segue sem eles
          python3 - <<'PY'
          p = "scripts/make-pkg.sh"
          s = open(p).read()
          old = 'cp "$OPENORBIS/samples/piglet/sce_module/"*.prx "$STAGE/sce_module/"'
          assert old in s, "make-pkg.sh mudou: ajuste o workflow"
          s = s.replace(old, old + ' || echo "sem modulos do piglet (ok)"', 1)
          mark = 'LABEL="$(printf'
          assert mark in s, "make-pkg.sh mudou: ajuste o workflow"
          s = s.replace(mark, 'find "$STAGE" -type d -empty -delete\n' + mark, 1)
          open(p, "w").write(s)
          PY
          export CEMU_PS4_VERSION="$VERSION"
          if [ "$LAB" = "true" ]; then export CEMU_PS4_LAB=1; fi
          bash scripts/package-cemu.sh > "$PSB/logs/package.log" 2>&1 \
            || { echo "::error::empacotamento falhou"; tail -n 80 "$PSB/logs/package.log"; exit 1; }
          tail -n 5 "$PSB/logs/package.log"
          ls -la out/*.pkg

      - name: "16. Publicar o .pkg em Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portal-test-${{ github.run_number }}
          name: "Crema + Portal of Power (teste ${{ github.run_number }}, v${{ inputs.version }})"
          prerelease: true
          files: ${{ github.workspace }}/out/*.pkg
          body: |
            Build de teste do Crema com a pagina **Portal of Power** (L3+R3 -> Portal of Power).
            Nao foi testado em um PS4 ainda.

            Instalar: copie o `.pkg` para `/data/pkg` no PS4 (FTP) e instale pelo Package Installer do GoldHEN.
            As figuras (`.sky`) ficam em `/data/Crema/Skylanders`.

      - name: "Guardar os logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PSB }}/logs
            ${{ env.PSB }}/build/deps/*.log
          if-no-files-found: ignore
          retention-days: 7
